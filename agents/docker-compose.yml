version: "3.8"

services:
  agent-server:
    build: .
    image: deep-researcher-v2-agents
    container_name: agent_server
    ports:
      - "8001:8001"
    environment:
      # Optional: Provide internal SearXNG URL so the app can talk to it seamlessly
      - SEARXNG_URL=http://agent_searxng:8080
      # Provide Ollama URL if hosted elsewhere
      # - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - agent_searxng
    volumes:
      - .:/app # Hot reloading for dev

  agent_searxng:
    image: searxng/searxng:latest
    container_name: agent_searxng
    ports:
      - "8081:8080" # Moved to 8081 to avoid binding conflict if you already have searxng on 8080
    environment:
      - INSTANCE_NAME=AgentSearXNG
    volumes:
      - ./searxng-data:/etc/searxng
    restart: unless-stopped
