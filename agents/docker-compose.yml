services:
  agent-server:
    build: .
    image: deep-researcher-v2-agents
    container_name: agent_server
    ports:
      - "8001:8001"
    environment:
      - SEARXNG_URL=http://agent_searxng:8080
    depends_on:
      - agent-searxng          # ← Fixed: must match the service name below
    volumes:
      - .:/app
      - /app/.venv

  agent-searxng:               # ← Consistent name with hyphen (recommended)
    image: searxng/searxng:latest
    container_name: agent_searxng
    ports:
      - "8081:8080"
    environment:
      - INSTANCE_NAME=AgentSearXNG
    volumes:
      - ./searxng-data:/etc/searxng
    restart: unless-stopped